<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Lab<span>K8</span>stack</a>
    <nav class="nav">
      {% if user %}
        <a href="/dashboard">Challenges</a>
        <a href="/leaderboard">Leaderboard</a>
        <span class="who" title="signed in as">{{ user.name }}</span>
        <form method="post" action="/logout" class="inline">
          <button type="submit" class="linklike">Sign out</button>
        </form>
      {% else %}
        <a href="/leaderboard">Leaderboard</a>
      {% endif %}
      <span class="mode mode-{{ mode }}" title="LAB_MODE">{{ mode }}</span>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <span>&copy; 2026 LabK8stack</span>
  </footer>

  <script src="/static/app.js" defer></script>
  <script src="/static/landing.js" defer></script>
  <script src="/static/navigation.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
