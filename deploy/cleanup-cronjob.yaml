apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-lab-cleanup
  namespace: k8s-lab-system
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: lab-provisioner
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: ghcr.io/CHANGE_ME/k8s-lab-platform:0.2.0
              command: ["python", "-m", "app.cleanup", "--apply"]
              env:
                - name: LAB_MODE
                  value: kubernetes
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: k8s-lab-platform-config
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
