# RBAC untuk mode LAB_MODE=kubernetes.
#
#   kubectl apply -f deploy/rbac.yaml
#
# Model:
#   - Platform memakai identitas "lab-provisioner" (atau kubeconfig admin saat
#     dijalankan di luar cluster) untuk membuat/menghapus namespace.
#   - Di setiap namespace lab-u<id>-<slug> dibuat ServiceAccount "lab-runner" yang
#     di-bind ke ClusterRole "lab-user" (hanya resource di namespace itu).
#   - Semua perintah user dijalankan dengan
#     --as=system:serviceaccount:lab-u<id>-<slug>:lab-runner
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab-system
  labels:
    app.kubernetes.io/part-of: k8s-lab
    k8s-lab.io/component: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-provisioner
  namespace: k8s-lab-system
---
# Hak yang dimiliki setiap peserta, dibatasi oleh RoleBinding di namespace-nya.
# Tidak ada akses ke node, namespace lain, RBAC, CRD, atau exec ke pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-user
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Identitas platform: hanya boleh mengelola namespace lab dan me-rebind
# ServiceAccount peserta. Tidak bisa membaca Secret aplikasi user.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Wajib agar RoleBinding ke ClusterRole lab-user diizinkan.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["lab-user"]
    verbs: ["bind"]
  # Wajib untuk --as=system:serviceaccount:<ns>:lab-runner
  - apiGroups: [""]
    resources: ["serviceaccounts", "users", "groups"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-provisioner
subjects:
  - kind: ServiceAccount
    name: lab-provisioner
    namespace: k8s-lab-system
