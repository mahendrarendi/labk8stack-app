# RBAC for LAB_MODE=kubernetes.
#
#   kubectl apply -f deploy/rbac.yaml
#
# Model:
#   - The platform uses the "lab-provisioner" identity to manage namespaces.
#   - Each lab namespace gets a "lab-runner" ServiceAccount bound to the
#     "lab-user" ClusterRole through a namespaced RoleBinding.
#   - Learner commands use
#     --as=system:serviceaccount:lab-u<id>-<slug>:lab-runner
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab-system
  labels:
    app.kubernetes.io/part-of: k8s-lab
    k8s-lab.io/component: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-provisioner
  namespace: k8s-lab-system
---
# Runner permissions are scoped by the RoleBinding in each namespace.
# No access to nodes, other namespaces, RBAC, CRDs, or Pod exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-user
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
# The platform identity manages lab namespaces and runner RoleBindings.
# It cannot read application Secrets in learner namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Required to bind the lab-user ClusterRole through a RoleBinding.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["lab-user"]
    verbs: ["bind"]
  # Restrict impersonation to the lab-runner ServiceAccount.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["lab-runner"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-provisioner
subjects:
  - kind: ServiceAccount
    name: lab-provisioner
    namespace: k8s-lab-system
