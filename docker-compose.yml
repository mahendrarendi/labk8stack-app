services:
  db:
    image: postgres:17-alpine
    container_name: k8s-lab-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-k8slab}
      POSTGRES_USER: ${POSTGRES_USER:-k8slab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  platform:
    build: .
    image: k8s-lab-platform:local
    container_name: k8s-lab-platform
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # .env adalah satu-satunya tempat konfigurasi image challenge.
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-k8slab}:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/${POSTGRES_DB:-k8slab}
      LAB_MODE: ${LAB_MODE:-fake}
      LAB_KUBECONFIG: ${LAB_KUBECONFIG:-}
      LAB_IMPERSONATE: ${LAB_IMPERSONATE:-true}
      LAB_RUNNER_SA: ${LAB_RUNNER_SA:-lab-runner}
      LAB_RUNNER_CLUSTERROLE: ${LAB_RUNNER_CLUSTERROLE:-lab-user}
      LEADERBOARD_DAYS: ${LEADERBOARD_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # Untuk mode kubernetes di luar cluster, mount kubeconfig read-only:
    # tambahkan
    #   volumes:
    #     - ${HOME}/.kube/config:/kube/config:ro
    # lalu set LAB_KUBECONFIG=/kube/config
    restart: unless-stopped
    command: ["sh", "-c", "python -m app.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    container_name: k8s-lab-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      platform:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
